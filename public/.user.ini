; PHP upload limits for Task Fiend.
; These must match (or exceed) MAX_FILE_SIZE in .env.
; PHP enforces these limits independently of nginx's client_max_body_size.
;
; For PHP-FPM (Docker / Nginx setups): place an .ini file in
;   /usr/local/etc/php/conf.d/uploads.ini  (official PHP Docker images)
; or set these values in your FPM pool config (www.conf).
; This .user.ini is read by PHP-FPM from the document root, but only if
; user_ini.filename is enabled (it is by default) — changes take effect
; within user_ini.cache_ttl seconds (default 300); restart PHP-FPM to
; apply immediately.
upload_max_filesize = 45M
post_max_size = 47M
