; PHP upload limits — must match MAX_FILE_SIZE in .env.
; Loaded automatically from /usr/local/etc/php/conf.d/ by the official PHP Docker image.
; Mount this file in docker-compose.yml:
;   volumes:
;     - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
upload_max_filesize = 60M
post_max_size = 60M
