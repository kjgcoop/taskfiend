version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_fiend_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./database:/var/www/html/database
      - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - task_fiend
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite

  nginx:
    image: nginx:alpine
    container_name: task_fiend_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8118}:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template
      - /etc/letsencrypt/live/${APP_DOMAIN}:/etc/letsencrypt/live/${APP_DOMAIN}:ro
      - /etc/letsencrypt/archive/${APP_DOMAIN}:/etc/letsencrypt/archive/${APP_DOMAIN}:ro
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    networks:
      - task_fiend
    depends_on:
      - app

networks:
  task_fiend:
    driver: bridge
