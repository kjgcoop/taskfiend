site_name: Task Fiend Documentation
site_url: https://taskfiend.kjcoop.com/
nav:
  - Home: index.md
  - About:
    - About: about/about.md
    - Differences from Todoist: about/todoist-differences.md
    - Intentionally Missing Features: about/intentionally-missing-features.md
    - Features that Sound Nice But that May Never Be Implemented: about/maybe-someday.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Migrating from Todoist: getting-started/todoist-import.md
  - Features:
    - Overview: features/overview.md
    - Quick-Add & Inline Syntax: features/inline.md
    - Dates & Recurrence: features/dates.md
    - Recurring Tasks: features/recurring-tasks.md
    - Admin Functions: features/admin-functionality.md
    - Importing from Markdown: features/import-from-md.md
  - Self-Hosting:
    - Docker: self-hosting/docker.md
    - Security: self-hosting/security.md
  - For Developers:
    - Overview: developers/index.md
    - API Reference: developers/api.md
    - Testing: developers/testing.md
  - Privacy Policy: privacy.md
theme:
  name: material
  favicon: img/favicon.ico
  logo: img/favicon.svg
  palette:
    scheme: slate
    primary: deep purple
    accent: green
extra_css:
  - css/style.css
extra:
  consent:
    title: Cookie consent
    description: >-
      We use only essential cookies to recognize your repeated visits and preferences, but sometimes it feels good to hit the reject button.
    actions:
      - reject
copyright: >
  Copyright &copy; 2026 <a href="mailto:taskfiend@kjcoop.com">KJ Coop</a> –
  <a href="#__consent">Change cookie settings</a>
markdown_extensions:
  - attr_list
  - md_in_html

