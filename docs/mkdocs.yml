site_name: Task Fiend Documentation
site_url: https://taskfiend.kjcoop.com/
nav:
  - Home: index.md
  - About: about.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Todoist Import: getting-started/todoist-import.md
  - Features: 
    - Feature Overview: features/overview.md
    - Admin-Like Functionality: features/admin-functionality.md
    - Dates: features/dates.md
    - Inline Values: features/inline.md
    - Todoist Import: features/todoist-import.md
  - Privacy Policy: privacy.md
theme: 
  name: material
  favicon: img/favicon.ico
  logo: img/favicon.svg
  palette:
    scheme: slate
    primary: deep purple
    accent: green
extra_css:
  - css/style.css
extra:
  consent:
    title: Cookie consent
    description: >- 
      We use only essential cookies to recognize your repeated visits and preferences, but sometimes it feels good to hit the reject button.
    actions:
      - reject
copyright: >
  Copyright &copy; 2026 KJ Coop – 
  <a href="#__consent">Change cookie settings</a>
markdown_extensions:
  - attr_list
  - md_in_html

