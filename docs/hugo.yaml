languageCode: en-US
taxonomies:
  category: categories
  tag: tags
params:
  defaultTheme: auto
  disableThemeToggle: false
  showShareButtons: false
  showReadingTime: false
  showToc: true
  showBreadCrumbs: true
  showCodeCopyButtons: true
  comments: false
  hideFooter: true
  assets:
    favicon: /favicon.ico
    disableHLJS: true
  author:
    name: KJ
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    style: monokai
  goldmark:
    renderer:
      unsafe: true
outputs:
  home:
    - HTML
    - RSS
    - JSON
outputFormats:
  RSS:
    mediaType: application/rss+xml
    baseName: feed
menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: Templates
      pageRef: /templates
      weight: 3
    - name: Privacy Policy
      pageRef: /privacy
      weight: 4
    - name: Source Code
      weight: 5
      url: "https://github.com/kjgcoop/taskfiend"
